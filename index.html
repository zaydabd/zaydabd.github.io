<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Wan Zayd Abdullah — back soon</title>
<style>
:root{--bg:#FFF;--tile:#EBE6DA;--ink:#1A1A1A;--mute:#6B675F;--wine:#7A1220;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#000;--tile:#202020;--ink:#F4F1EA;--mute:#9A958A;--wine:#FF4A4A;color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.t{position:relative;width:100%;max-width:340px;height:216px;background:var(--tile);border-radius:26px 26px 26px 6px;padding:20px}
h1{font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:.92}
.eb{position:absolute;left:20px;right:20px;bottom:18px;font-family:ui-monospace,"SF Mono",Consolas,Menlo,monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.eb b{color:var(--wine);font-weight:600}
</style>
</head>
<body>
<div class="t"><h1>Hi, I’m Zayd.</h1><p class="eb"><b>In maintenance</b> · Senior Technical Lead · OutSystems · back soon</p></div>
</body>
</html>
